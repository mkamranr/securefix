# HTTPS front for the app. Certificates come from ./certs (see README).
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Plain HTTP sent to this port: redirect to HTTPS on the same host:port.
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $http_host;   # keeps a non-default port in absolute redirects
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
