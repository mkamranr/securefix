# Runs on the air-gapped server. All images are loaded from the exported archive;
# pull_policy: never makes Docker fail fast instead of trying to reach a registry.
name: vulntriage

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulntriage
      POSTGRES_USER: vt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vt -d vulntriage"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: vulntriage:${VT_VERSION:?Set VT_VERSION in .env}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment: &app_env
      VT_DATABASE_URL: postgresql+psycopg://vt:${POSTGRES_PASSWORD}@db:5432/vulntriage
      VT_EMBEDDED_WORKER: "false"
      # Plain HTTP by default: the session cookie can't be Secure and no proxy headers are trusted.
      # Behind the https proxy, set VT_COOKIE_SECURE=true and VT_TRUSTED_PROXIES=* in .env.
      VT_COOKIE_SECURE: ${VT_COOKIE_SECURE:-false}
      VT_TRUSTED_PROXIES: ${VT_TRUSTED_PROXIES:-127.0.0.1}
      VT_CA_BUNDLE: ${VT_CA_BUNDLE_IN_CONTAINER:-/certs/ca.pem}
    volumes: &app_volumes
      - app-data:/var/lib/vulntriage
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ${SEMGREP_RULES_DIR:-./rules}:/opt/rules:ro
    # The app's only host port (plain HTTP). Postgres publishes none, so it can't clash with other databases on the host.
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: vulntriage:${VT_VERSION}
    pull_policy: never
    restart: unless-stopped
    command: ["python3", "-m", "app.worker"]
    env_file: .env
    environment: *app_env
    volumes: *app_volumes
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  # HTTPS front, off by default. Enable with COMPOSE_PROFILES=https in .env (see .env.example).
  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    pull_policy: never
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  app-data:
